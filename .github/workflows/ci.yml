# Single pipeline: on any push/PR we build + verify. Publishing a GitHub Release
# happens only for v* tags — and reuses the exact artifact the build job just
# produced (built once, released once, never rebuilt for release).

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # for the release job only; build job cannot create releases

jobs:
  build:
    name: Build (x86, net40) + verify resources
    runs-on: windows-latest
    outputs:
      release_name: ${{ steps.version.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86

      # Only on release tags: stamp the assembly version from the tag so
      # `Updater` compares against the exact released version. Must run
      # BEFORE the build itself.
      - name: Stamp assembly version from tag (releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = "$($env:GITHUB_REF_NAME.TrimStart("v"))"
          $file = "src\HIDTester\Properties\AssemblyInfo.cs"
          (Get-Content $file -Raw) `
            -replace 'AssemblyVersion\(".*?"\)', ('AssemblyVersion("' + $ver + '")') `
            -replace 'AssemblyFileVersion\(".*?"\)', ('AssemblyFileVersion("' + $ver + '")') `
            | Set-Content $file -NoNewline
          Get-Content $file | Select-String "AssemblyVersion"

      # GH runners ship the .NET 4.8 runtime but no net40 reference assemblies;
      # compiling against the 4.0.30319 runtime dir reproduces the original
      # binary's reference set without the retired net40 dev pack.
      - name: Build (Release, Rebuild)
        run: >
          msbuild "src\HIDTester\MINI KeyBoard.csproj"
          /p:Configuration=Release /t:Rebuild /m
          /v:m /nologo /p:WarningLevel=0
          "/p:FrameworkPathOverride=C:\Windows\Microsoft.NET\Framework64\v4.0.30319"

      - name: Verify embedded resources against shipped reference
        shell: pwsh
        run: pwsh -NoProfile -File verify/verify-resources.ps1

      - name: Stage artifact payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "src\HIDTester\bin\Release\MINI KeyBoard.exe" dist\
          Copy-Item "src\HIDTester\bin\Release\MINI KeyBoard.exe.config" dist\
          Copy-Item "reference\HidLibrary.dll" dist\
          Copy-Item "reference\Theraot.Core.dll" dist\
          @('README.md', 'LICENSE') | ForEach-Object { Copy-Item $_ dist\ }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Zip artifact
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "commit-$($env:GITHUB_SHA.Substring(0,7))" }
          Compress-Archive -Path dist\* -DestinationPath "MiniKeyboardTool-$ver.zip" -Force
          "ZIP_NAME=MiniKeyboardTool-$ver.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "release_name=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-Item "MiniKeyboardTool-$ver.zip" | Select-Object Name, Length

      # Build the setup EXE with the vendored Inno Setup 7 compiler.
      # Reads dist\MINI KeyBoard.exe for the version — so this runs after
      # both the stamping and the staging steps above.
      - name: Compile installer (Inno Setup)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          & "tools\innosetup\ISCC.exe" "installer\minikeyboardtool.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist | Select-Object Name, Length

      # Merge every release payload into uploads/ with a single flat level:
      # the zip (tag name on tags, commit-<sha> name on PRs) and, when it
      # exists, the setup EXE from dist/.
      - name: Collect uploads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path uploads | Out-Null
          Get-ChildItem -File -Filter "MiniKeyboardTool-*.zip" | Move-Item -Destination uploads\ -Force
          Get-ChildItem dist -File -Filter "*-setup.exe" -ErrorAction SilentlyContinue | Move-Item -Destination uploads\ -Force
          Get-ChildItem uploads | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: uploads/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Create GitHub Release with built payload
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            MiniKeyboardTool-*.zip
            MiniKeyboardTool-*-setup.exe
